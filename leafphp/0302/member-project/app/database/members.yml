# schema files add auto-increments and timestamps automatically

# you can add all the columns you want under the columns key
soft_deletes: true
columns:
  name:
    type: string
    nullable: false
  email:
    type: string
    unique: true
  phone:
    type: string
    unique: true
  status:
    type: enum
    values:
      - active
      - inactive
      - pending
      - banned
    default: pending
  notes:
    type: text
    nullable: true
  identifier:
    type: string
    unique: true
  verified_at:
    type: timestamp
    nullable: true
  deleted_at:
    type: timestamp
    nullable: true
relationships:
  - User

# you can add foreign ids for other models under the relationships key key
# relationships:
#   - User

# seeds are optional and can be used to populate the database with dummy data from models
seeds:
  count: 5
  truncate: true
  data:
    name: "@faker.name"
    email: "@faker.unique.email"
    phone: "@faker.unique.phoneNumber"
    status: "pending"
    notes: "@faker.text"
    identifier: "@faker.unique.uuid"
    user_id: 6
    verified_at: null
